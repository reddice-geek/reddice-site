<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Les jeux possédés par REDDICE, classés par plateforme.">
  <title>REDDICE — Mes jeux</title>
  <link rel="stylesheet" href="site-global.css">
  <link rel="icon" type="image/png" href="assets/logo-main.png">
</head>
<body>
  <main id="root">
    <section class="rd-section rd-shell">
      <div class="rd-section-head">
        <div><div class="rd-kicker">INVENTAIRE // JEUX</div><h1>Mes jeux</h1><p class="rd-muted">Collection personnelle de REDDICE, synchronisée depuis la liste fournie.</p></div>
        <div class="rd-badge"><span id="game-count">0</span> JEUX</div>
      </div>
      <div class="rd-game-controls">
        <input id="game-search" type="search" placeholder="Rechercher un jeu…" aria-label="Rechercher un jeu">
        <select id="game-platform" aria-label="Filtrer par plateforme">
          <option value="all">Toutes les plateformes</option>
          <option value="Steam">Steam</option><option value="Epic Games">Epic Games</option><option value="GOG">GOG</option><option value="Ubisoft">Ubisoft</option><option value="EA">EA</option>
        </select>
      </div>
      <div class="rd-platform-stats" id="platform-stats"></div>
      <div class="rd-games-grid" id="games-list"><div class="rd-loading">CHARGEMENT DE LA COLLECTION…</div></div>
    </section>
  </main>
  <script src="site-enhancements.js"></script>
  <script>
    let games = [];
    const list = document.getElementById('games-list');
    const search = document.getElementById('game-search');
    const platform = document.getElementById('game-platform');
    const count = document.getElementById('game-count');
    const stats = document.getElementById('platform-stats');
    const esc = v => String(v || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function renderStats() {
      const order = ['Steam','Epic Games','GOG','Ubisoft','EA'];
      stats.innerHTML = order.map(p => `<span><strong>${games.filter(g => g.plateforme === p).length}</strong> ${esc(p)}</span>`).join('');
    }
    function render() {
      const q = search.value.trim().toLowerCase();
      const pl = platform.value;
      const filtered = games.filter(g => (!q || g.titre.toLowerCase().includes(q)) && (pl === 'all' || g.plateforme === pl));
      count.textContent = filtered.length;
      list.innerHTML = filtered.length ? filtered.map((g,i) => `<article class="rd-game"><span>${String(i+1).padStart(3,'0')}</span><strong>${esc(g.titre)}</strong><small>${esc(g.plateforme)}</small></article>`).join('') : '<div class="rd-planning-empty"><strong>Aucun jeu trouvé.</strong><span>Essaie un autre terme ou une autre plateforme.</span></div>';
    }
    Promise.all([
      fetch('data/games.json').then(r => r.json())
    ]).then(([data]) => {
      games = Array.isArray(data) ? data : [];
      renderStats(); render();
    }).catch(() => { list.innerHTML = '<div class="rd-planning-empty"><strong>Impossible de charger la collection.</strong></div>'; });
    search.addEventListener('input', render); platform.addEventListener('change', render);
  </script>
</body>
</html>
