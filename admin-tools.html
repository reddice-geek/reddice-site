<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion — Reddice</title><style>body{background:#060b13;color:#edf7ff;font:16px system-ui;margin:0}header,main{max-width:1050px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}button,input,textarea{font:inherit;padding:10px;border:1px solid #276078;border-radius:7px;background:#0e1d2b;color:white}button{cursor:pointer}button:hover{border-color:#00efff}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.panel{background:#101b2a;border:1px solid #29485d;padding:18px;border-radius:10px;margin:12px 0}label{display:block;margin:12px 0}input,textarea{box-sizing:border-box;width:100%}textarea{min-height:90px}.danger{color:#ff8888}#status{color:#00efca;white-space:pre-wrap}small{color:#a4b4c3}h1,h2{color:#00efff}article{overflow-wrap:anywhere}</style></head><body><header><h1>Gestion du site</h1><a href="admin.html" style="color:#00efff">← Panneau admin</a></header><main><label>Mot de passe administrateur (Vercel : ADMIN_PASSWORD)<input id="password" type="password" autocomplete="off" placeholder="Mot de passe"></label><nav><button onclick="show('planning')">📅 Planning</button><button onclick="show('contacts')">✉️ Contacts</button><button onclick="show('avis')">⭐ Livre d'or / Avis</button></nav><p id="status" role="status"></p><section id="editor"></section><section id="items"></section></main><script>
let section='planning', rows=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method,id,body){const q=new URLSearchParams({type:section});if(id)q.set('id',id);const r=await fetch('/api/admin-manage?'+q,{method,headers:{'Authorization':'Bearer '+$('password').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Erreur serveur');return data;}
async function show(s){section=s;$('status').textContent='Chargement…';$('editor').innerHTML='';$('items').innerHTML='';try{const data=await api('GET');rows=data.items||[];$('status').textContent=rows.length+' élément(s)';render();}catch(e){$('status').textContent='Erreur : '+e.message;}}
function form(item={}){return `<div class="panel"><h2>${item.id?'Modifier':'Ajouter'} un stream</h2><form id="streamform"><input type="hidden" name="id" value="${esc(item.id||'')}"><label>Titre<input name="title" required value="${esc(item.title||'')}"></label><label>Date et heure<input name="start_at" type="datetime-local" required value="${esc((item.start_at||'').slice(0,16))}"></label><label>Jeu<input name="game" value="${esc(item.game||'')}"></label><label>Description<textarea name="description">${esc(item.description||'')}</textarea></label><button>Enregistrer</button></form></div>`}
function render(){if(section==='planning'){$('editor').innerHTML=form();bindForm();}else $('editor').innerHTML='';$('items').innerHTML=rows.map(x=>`<article class="panel"><h3>${esc(section==='planning'?x.title:section==='contacts'?x.subject||'Message':x.title||'Avis')}</h3><small>${esc(x.created_at||x.start_at||'')} — ${esc(x.name||x.game||'')}</small>${x.email?`<p>Email : ${esc(x.email)}</p>`:''}<p>${esc(x.message||x.description||'')}</p>${section==='avis'?`<p>Note : ${esc(x.rating||'—')}/5</p>`:''}${section==='planning'?`<button data-edit="${esc(x.id)}">Modifier</button>`:''} <button data-del="${esc(x.id)}">Supprimer</button></article>`).join('')||'<p>Aucun élément.</p>';
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=rows.find(x=>String(x.id)===b.dataset.edit);$('editor').innerHTML=form(x);bindForm();window.scrollTo({top:0,behavior:'smooth'});});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement cet élément ?'))return;try{await api('DELETE',b.dataset.del);await show(section)}catch(e){alert(e.message)}});}
function bindForm(){$('streamform').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.currentTarget));const id=b.id;delete b.id;try{await api(id?'PATCH':'POST',id,b);await show('planning')}catch(e){alert(e.message)}}}
</script></body></html>
