        h1,h2,.ox{font-family:"Oxanium", sans-serif}
        /* Scanlines */
        .scanlines::before{
          content:"";
          position:fixed; inset:0;
          background: repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.03) 0px,
            rgba(255,255,255,0.03) 1px,

          box-shadow: inset 0 0 18px rgba(0,240,255,0.18), 0 0 12px rgba(0,240,255,0.35);
          background: linear-gradient(180deg, rgba(8,14,22,0.96) 0%, rgba(5,7,10,0.98) 100%);
