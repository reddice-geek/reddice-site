<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Livre d'or - V4 Clean</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="guestbook">
<div class="fusion-orbs"><div class="orb orb-cyan"></div><div class="orb orb-violet"></div><div class="orb orb-pink"></div></div>
<main class="container" style="display:grid; gap:2rem; padding-top:2.4rem">
<section class="shell reveal visible" style="padding:2.4rem">
<div style="display:flex; justify-content:space-between; flex-wrap:wrap"><div><span class="kicker">HOLO-FEED // VIDE DE BASE - CLEAN</span><h2>Livre d'or - Vide de base</h2><p class="lead">Avis reel avec note sur 5 - Vide de base, plus besoin de supprimer via admin.</p></div><span id="guestbook-count" class="mini-chip">0 avis • Clean</span></div>
<div class="guestbook-grid" style="gap:1.8rem; margin-top:1.6rem">
<div class="card" style="padding:1.8rem; position:sticky; top:92px">
<h3>Publier</h3>
<form id="guestbook-form" style="display:grid; gap:1rem; margin-top:1rem">
<input type="text" name="name" placeholder="Ton pseudo" required>
<input type="text" name="title" placeholder="Titre optionnel">
<textarea name="message" rows="7" placeholder="Ton message qui respire..." required></textarea>
<input type="hidden" id="guestbook-rating" value="5">
<div class="guestbook-stars" id="guestbook-stars"><button type="button" class="guestbook-star is-active" data-rating-value="1">★</button><button type="button" class="guestbook-star is-active" data-rating-value="2">★</button><button type="button" class="guestbook-star is-active" data-rating-value="3">★</button><button type="button" class="guestbook-star is-active" data-rating-value="4">★</button><button type="button" class="guestbook-star is-active" data-rating-value="5">★</button></div>
<button type="submit" class="btn btn-primary">Publier en Holo-Feed</button>
<div id="guestbook-status" style="font-family:var(--font-mono); font-size:.82rem; padding:.6rem; background:rgba(0,0,0,0.18); display:grid; place-items:center">Pret</div>
</form>
</div>
<div style="display:grid; gap:1rem"><span class="kicker">FEED</span><div id="guestbook-list" style="display:grid; gap:1rem"><div class="card" style="text-align:center; color:var(--muted)">Aucun avis pour l'instant. Sois le premier choom — feed vide de base, clean.</div></div><div id="guestbook-pagination"></div></div>
</div>
</section>
</main>
<script src="script.js"></script>
</body></html>
