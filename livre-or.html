<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Livre d’or de REDDICE. Laisse un message et une note au streamer.">
  <title>REDDICE — Livre d’or</title>
  <link rel="stylesheet" href="site-global.css">
  <link rel="icon" type="image/png" href="assets/logo-main.png">
</head>
<body>
  <main id="root">
    <section class="rd-section rd-shell">
      <div class="rd-section-head">
        <div><div class="rd-kicker">COMMUNITY // GUESTBOOK</div><h1>Livre d’or</h1><p class="rd-muted">La page repart sans avis de démonstration. Les prochains messages viennent uniquement des visiteurs.</p></div>
        <div class="rd-badge"><span id="guestbook-count">0</span> AVIS</div>
      </div>

      <div class="rd-guestbook-grid">
        <form id="guestbook-form" class="rd-spec-card">
          <div class="rd-card-label">LAISSER UN MESSAGE</div>
          <label>Pseudo<input name="name" required maxlength="80"></label>
          <label>Titre<input name="title" maxlength="120"></label>
          <label>Message<textarea name="message" required maxlength="1200" rows="7"></textarea></label>
          <label>Note
            <select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
          </label>
          <input name="website" tabindex="-1" autocomplete="off" class="rd-honeypot" aria-hidden="true">
          <button class="rd-btn rd-btn-primary" type="submit">Publier</button>
          <p class="rd-form-status" id="form-status"></p>
        </form>

        <div class="rd-review-list" id="guestbook-list">
          <div class="rd-loading">CHARGEMENT DU LIVRE D’OR…</div>
        </div>
      </div>
    </section>
  </main>
  <script src="site-enhancements.js"></script>
  <script>
    const STORAGE = 'reddice_guestbook_v4';
    // Ignore and remove the previous demonstration cache from older builds.
    try { localStorage.removeItem('reddice_guestbook_auto_v3'); } catch (_) {}
    const form = document.getElementById('guestbook-form');
    const list = document.getElementById('guestbook-list');
    const count = document.getElementById('guestbook-count');
    const status = document.getElementById('form-status');

    const esc = v => String(v || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function readLocal() { try { const x = JSON.parse(localStorage.getItem(STORAGE) || '[]'); return Array.isArray(x) ? x : []; } catch (_) { return []; } }
    function saveLocal(items) { try { localStorage.setItem(STORAGE, JSON.stringify(items)); } catch (_) {} }
    function render(items) {
      count.textContent = items.length;
      if (!items.length) {
        list.innerHTML = '<div class="rd-planning-empty"><strong>Aucun avis pour le moment.</strong><span>Sois le premier à laisser un message à REDDICE.</span></div>';
        return;
      }
      list.innerHTML = items.map(item => `
        <article class="rd-review">
          <div class="rd-review-top"><strong>${esc(item.name)}</strong><span>${'★'.repeat(Math.max(0, Math.min(5, Number(item.rating || 5))))}</span></div>
          ${item.title ? `<h2>${esc(item.title)}</h2>` : ''}
          <p>${esc(item.message)}</p>
          <small>${new Date(item.created_at || Date.now()).toLocaleDateString('fr-FR')}</small>
        </article>`).join('');
    }

    fetch('/api/guestbook')
      .then(r => r.json())
      .then(data => {
        const serverItems = Array.isArray(data.items) ? data.items : [];
        render(serverItems.length ? serverItems : readLocal());
      })
      .catch(() => render(readLocal()));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'PUBLICATION…';
      const fd = new FormData(form);
      const payload = Object.fromEntries(fd.entries());
      payload.rating = Number(payload.rating || 5);
      try {
        const response = await fetch('/api/guestbook', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'Erreur');
        const current = readLocal();
        if (data.item && !current.some(x => String(x.id) === String(data.item.id))) current.unshift(data.item);
        saveLocal(current.slice(0, 100));
        form.reset();
        status.textContent = 'MESSAGE PUBLIÉ.';
        if (data.item) {
          const visible = readLocal();
          render(visible);
        }
      } catch (error) {
        status.textContent = `ERREUR : ${error.message}`;
      }
    });
  </script>
</body>
</html>
