<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contacter REDDICE et la Furioz Compagnie.">
  <title>REDDICE — Contact</title>
  <link rel="stylesheet" href="site-global.css">
  <link rel="icon" type="image/png" href="assets/logo-main.png">
</head>
<body>
  <main id="root">
    <section class="rd-section rd-shell">
      <div class="rd-section-head">
        <div><div class="rd-kicker">COMMS // REDDICE</div><h1>Contact</h1><p class="rd-muted">Une question, une proposition ou simplement un message ? Utilise ce formulaire.</p></div>
        <a class="rd-btn" href="https://www.twitch.tv/reddice_stream">Twitch</a>
      </div>
      <form id="contact-form" class="rd-contact-form">
        <div class="rd-contact-col">
          <label>Nom<input name="name" required maxlength="80"></label>
          <label>Email<input name="email" type="email" required maxlength="120"></label>
          <label>Sujet<input name="subject" maxlength="140"></label>
          <label class="rd-honeypot">Site web<input name="website" tabindex="-1" autocomplete="off"></label>
        </div>
        <div class="rd-contact-col">
          <label>Message<textarea name="message" required maxlength="2000" rows="10"></textarea></label>
          <button class="rd-btn rd-btn-primary" type="submit">Envoyer</button>
          <p class="rd-form-status" id="contact-status"></p>
        </div>
      </form>
    </section>
  </main>
  <script src="site-enhancements.js"></script>
  <script>
    const form=document.getElementById('contact-form'); const status=document.getElementById('contact-status');
    form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='ENVOI…';const payload=Object.fromEntries(new FormData(form).entries());try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Erreur');form.reset();status.textContent='MESSAGE ENVOYÉ.';}catch(err){status.textContent=`ERREUR : ${err.message}`;}});
  </script>
</body>
</html>
